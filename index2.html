<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Denis GUCHET</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: black;
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }

    .desktop {
      display: block;
    }

    .mobile {
      display: none;
    }

    @media (max-width: 768px) {
      .desktop {
        display: none;
      }
      .mobile {
        display: block;
      }
    }
  </style>
</head>

<body>
  <img src="V2.ORDI.png" class="desktop" alt="Denis GUCHET">
  <img src="V2.MOBI.png" class="mobile" alt="Denis GUCHET">
</body>
</html>
